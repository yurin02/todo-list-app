{% extends "base.html" %}
{% block title %}{% if mode == 'new' %}新規登録{% else %}編集{% endif %} - Todo List{% endblock %}
{% block content %}
<div class="form-card">
  <h2 class="form-title">{% if mode == 'new' %}新しいTodoを登録{% else %}Todoを編集{% endif %}</h2>
  <form method="post" action="{% if mode == 'new' %}/todos{% else %}/todos/{{ todo.ID }}{% endif %}" class="todo-form">
    <label class="form-label" for="title">タイトル</label>
    <input type="text" id="title" name="title" value="{{ todo.Title or '' }}" required class="form-input">

    <label class="form-label" for="content">内容</label>
    <textarea id="content" name="content" rows="4" class="form-input">{{ todo.Content or '' }}</textarea>

    <label class="form-label" for="due_date">期日</label>
    <input type="date" id="due_date" name="due_date" value="{{ todo.DueDate or '' }}" class="form-input">

    <label class="form-label" for="priority">重要度</label>
    <select id="priority" name="priority" class="form-input">
      {% set current_priority = todo.Priority or 3 %}
      <option value="1" {% if current_priority|int == 1 %}selected{% endif %}>1（低）</option>
      <option value="2" {% if current_priority|int == 2 %}selected{% endif %}>2（やや低）</option>
      <option value="3" {% if current_priority|int == 3 %}selected{% endif %}>3（普通）</option>
      <option value="4" {% if current_priority|int == 4 %}selected{% endif %}>4（高）</option>
    </select>

    <label class="form-label" for="category">カテゴリ</label>
    <select id="category" name="category" class="form-input">
      {% set current_category = todo.Category or "personal" %}
      {% for value, label in categories.items() %}
      <option value="{{ value }}" {% if current_category == value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>

    <label class="form-label" for="tags">タグ（カンマ区切りで複数入力可）</label>
    <input type="text" id="tags" name="tags" value="{{ todo.Tags or '' }}" placeholder="例: 急ぎ,経理" class="form-input">

    <div class="form-actions">
      <a href="/" class="btn btn-ghost">キャンセル</a>
      <button type="submit" class="btn btn-primary">{% if mode == 'new' %}登録する{% else %}更新する{% endif %}</button>
    </div>
  </form>
</div>
{% endblock %}
